version: '3.8'

services:

  mysql:
    image: mysql:8.0

    container_name: taskmanager-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskdb

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .

    container_name: taskmanager-app

    ports:
      - "8080:8080"

    depends_on:
      - mysql

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taskdb?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

volumes:
  mysql-data: